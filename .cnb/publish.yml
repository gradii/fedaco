"v*":
  tag_push:
    publish-npm:
      name: Publish npm packages
      # Import release secrets as environment variables.
      imports: https://cnb.cool/gradii/secret/-/blob/main/gradii/release-envs.yml
      docker:
        image: node:20
        volumes:
          - /root/.pnpm-store:copy-on-write
      env:
        NX_DAEMON: "false"
        NX_ISOLATE_PLUGINS: "false"
        CNB_NPM_REGISTRY: "https://npm.cnb.cool/gradii/npm/-/packages/"
      stages:
        - name: Install dependencies
          script: |
            corepack enable
            corepack prepare pnpm@10.24.0 --activate
            pnpm install --frozen-lockfile
        - name: Build libraries
          script: |
            pnpm nx run-many -t build \
              --projects=fedaco,mysql-driver,nest-fedaco,postgres-driver,sqlite-driver,sqlserver-driver
        - name: Bundle fedaco CLI into fedaco package
          script: pnpm build:cli
        - name: Derive version
          script: |
            VERSION="${CNB_BRANCH#v}"
            echo "version=$VERSION"
            echo "VERSION=$VERSION" > .release-env
        - name: Stamp version into dist package.json files
          script: |
            . ./.release-env
            for pkg in \
              dist/libs/fedaco/package.json \
              dist/libs/mysql-driver/package.json \
              dist/libs/nest-fedaco/package.json \
              dist/libs/postgres-driver/package.json \
              dist/libs/sqlite-driver/package.json \
              dist/libs/sqlserver-driver/package.json
            do
              node -e '
                const fs = require("fs");
                const [pkgPath, version] = process.argv.slice(1);
                const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
                pkg.version = version;
                if (pkg.peerDependencies && pkg.peerDependencies["@gradii/fedaco"]) {
                  pkg.peerDependencies["@gradii/fedaco"] = `^${version}`;
                }
                fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
                console.log(`  -> ${pkg.name}@${pkg.version}`);
              ' "$pkg" "$VERSION"
            done
        - name: Publish @gradii/fedaco
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: $CNB_NPM_REGISTRY
            folder: dist/libs/fedaco
            fail_on_version_conflict: true
        - name: Publish @gradii/fedaco-mysql-driver
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: $CNB_NPM_REGISTRY
            folder: dist/libs/mysql-driver
            fail_on_version_conflict: true
        - name: Publish @gradii/nest-fedaco
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: $CNB_NPM_REGISTRY
            folder: dist/libs/nest-fedaco
            fail_on_version_conflict: true
        - name: Publish @gradii/fedaco-postgres-driver
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: $CNB_NPM_REGISTRY
            folder: dist/libs/postgres-driver
            fail_on_version_conflict: true
        - name: Publish @gradii/fedaco-sqlite-driver
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: $CNB_NPM_REGISTRY
            folder: dist/libs/sqlite-driver
            fail_on_version_conflict: true
        - name: Publish @gradii/fedaco-sqlserver-driver
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: $CNB_NPM_REGISTRY
            folder: dist/libs/sqlserver-driver
            fail_on_version_conflict: true
